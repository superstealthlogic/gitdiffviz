<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Git Visualization Diff</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./vendor/highlight.min.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Git Visualization Diff</h1>
        <p id="summary">Loading scene...</p>
      </div>
      <div class="controls">
        <button id="openRepoButton" class="tauri-only" type="button" title="Open repository" hidden>Open Repo</button>
        <button id="upButton" type="button" title="Go to parent">Up</button>
        <button id="resetButton" type="button" title="Return to repository root">Reset</button>
        <button id="themeToggleButton" type="button" title="Toggle theme">Light</button>
      </div>
    </header>

    <section id="nativePanel" class="native-panel tauri-only" hidden>
      <label>
        Repo
        <span id="repoPath" class="repo-path">No repository selected</span>
      </label>
      <button id="browseRepoButton" type="button">Browse</button>
      <label>
        Base
        <select id="baseSelect" disabled></select>
      </label>
      <label>
        Target
        <select id="targetSelect" disabled></select>
      </label>
      <label class="checkbox-label">
        <input id="timelineInput" type="checkbox" />
        Timeline
      </label>
      <button id="waitOnButton" class="watch-button" type="button">
        <span id="waitOnButtonLabel">Wait On</span>
        <span id="waitOnBadge" class="watch-badge" hidden>0</span>
      </button>
      <button id="renderRepoButton" type="button">Render</button>
      <span id="nativeStatus" role="status"></span>
    </section>

    <main class="layout">
      <aside class="sidebar">
        <section>
          <h2>Legend</h2>
          <div id="legend"></div>
        </section>
        <section>
          <h2>Zoom</h2>
          <div id="zoomSummary" class="zoom-summary">Loading summary...</div>
        </section>
        <section>
          <h2>Selection</h2>
          <div id="selection" class="selection">Nothing selected.</div>
        </section>
      </aside>
      <section class="canvas-panel">
        <div class="canvas-toolbar">
          <span>Repository View</span>
          <div class="zoom-controls">
            <button id="zoomOutButton" type="button" title="Zoom out">-</button>
            <button id="zoomResetButton" type="button" title="Reset zoom">100%</button>
            <button id="zoomInButton" type="button" title="Zoom in">+</button>
          </div>
        </div>
        <div id="repositoryPrompt" class="repository-prompt tauri-only" hidden>Choose a repository to Render</div>
        <svg id="scene" viewBox="0 0 1200 800" role="img" aria-label="Git visualization diff scene"></svg>
      </section>
      <aside id="timelinePanel" class="timeline-panel" hidden>
        <h2>Timeline</h2>
        <div id="timelineEndDateTop" class="timeline-date"></div>
        <div class="timeline-track-wrap">
          <input id="timelineSlider" type="range" min="0" max="0" value="0" orient="vertical" />
          <div id="timelineTicks" class="timeline-ticks"></div>
        </div>
        <div id="timelineEndDateBottom" class="timeline-date"></div>
        <div id="timelineLabel" class="timeline-label"></div>
      </aside>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
