[package]
name = "git-visualization-diff-app"
version = "0.4.0"
description = "Native macOS host for Git Visualization Diff"
authors = ["Git Visualization Diff contributors"]
edition = "2021"

[[bin]]
name = "git-visualization-diff-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
